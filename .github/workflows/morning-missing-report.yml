name: 🌅 Morning Missing Report Reminder

on:
  schedule:
    # 7:00 AM ICT (GMT+7) = 0:00 UTC — Thứ 3 đến Thứ 7 (check report ngày làm việc trước)
    - cron: '0 0 * * 2-6'
  workflow_dispatch: # Manual trigger để test

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
  APP_URL: ${{ secrets.APP_URL }}

jobs:
  check-missing-reports:
    name: Check & Notify Missing Reports
    runs-on: ubuntu-latest
    steps:
      - name: Get date range
        id: dates
        run: |
          YESTERDAY=$(date -u -d "yesterday" '+%Y-%m-%d')
          TODAY=$(date -u '+%Y-%m-%d')
          # Get 30 days ago for streak calculation
          MONTH_AGO=$(date -u -d "30 days ago" '+%Y-%m-%d')
          echo "yesterday=$YESTERDAY" >> $GITHUB_OUTPUT
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "month_ago=$MONTH_AGO" >> $GITHUB_OUTPUT
          echo "📅 Checking reports for: $YESTERDAY"

      - name: Query and calculate streaks
        id: query
        run: |
          YESTERDAY="${{ steps.dates.outputs.yesterday }}"
          TODAY="${{ steps.dates.outputs.today }}"
          MONTH_AGO="${{ steps.dates.outputs.month_ago }}"

          # Get all non-admin users
          USERS_RESPONSE=$(curl -s \
            "${SUPABASE_URL}/rest/v1/profiles?role=neq.admin&select=id,full_name,email" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")

          echo "👥 All non-admin users:"
          echo "$USERS_RESPONSE" | jq -r '.[] | .full_name // .email'

          # Get logs from last 30 days (for streak calculation)
          LOGS_RESPONSE=$(curl -s \
            "${SUPABASE_URL}/rest/v1/ai_impact_logs?created_at=gte.${MONTH_AGO}T00:00:00&select=user_id,created_at" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")

          # Generate list of workdays (Mon-Fri) from yesterday going back
          WORKDAYS=""
          for i in $(seq 0 29); do
            DAY=$(date -u -d "$YESTERDAY - $i days" '+%Y-%m-%d')
            DOW=$(date -u -d "$DAY" '+%u')  # 1=Mon, 7=Sun
            if [ "$DOW" -le 5 ]; then
              WORKDAYS="$WORKDAYS $DAY"
            fi
          done
          WORKDAYS=$(echo $WORKDAYS | tr ' ' '\n' | head -20)  # Limit to 20 workdays
          echo "📆 Workdays to check: $(echo "$WORKDAYS" | wc -w)"

          # Create a JSON array of workdays
          WORKDAYS_JSON=$(echo "$WORKDAYS" | jq -R -s 'split("\n") | map(select(length > 0))')

          # Calculate streak for each user who missed yesterday
          RESULT=$(echo "$USERS_RESPONSE" | jq -r --argjson logs "$LOGS_RESPONSE" --argjson workdays "$WORKDAYS_JSON" '
            # Group logs by user and date
            ($logs | group_by(.user_id) | map({key: .[0].user_id, value: [.[] | .created_at[:10]] | unique}) | from_entries) as $user_logs |

            # For each user, calculate streak
            [.[] |
              . as $user |
              ($user_logs[$user.id] // []) as $dates |

              # Check if reported yesterday (first workday)
              ($workdays[0]) as $yesterday |
              ([$dates[] | select(. == $yesterday)] | length > 0) as $reported_yesterday |

              # If not reported yesterday, count streak
              if $reported_yesterday then
                null
              else
                # Count consecutive workdays without report
                (reduce $workdays[] as $day (
                  {streak: 0, stop: false};
                  if .stop then .
                  elif ([$dates[] | select(. == $day)] | length > 0) then
                    .stop = true
                  else
                    .streak += 1
                  end
                ) | .streak) as $streak |
                {
                  name: (.full_name // .email),
                  streak: $streak
                }
              end
            ] | map(select(. != null)) | sort_by(-.streak)
          ')

          echo "⚠️ Missing reporters with streaks:"
          echo "$RESULT" | jq -r '.[] | "\(.name) (\(.streak))"'

          MISSING_COUNT=$(echo "$RESULT" | jq 'length')
          echo "missing_count=$MISSING_COUNT" >> $GITHUB_OUTPUT

          # Format for Google Chat: "• Name (streak)"
          MISSING_LIST=$(echo "$RESULT" | jq -r '
            map("• \(.name) (\(.streak))") | join("\\n")
          ')
          echo "missing_list=$MISSING_LIST" >> $GITHUB_OUTPUT

      - name: Send Google Chat notification
        if: steps.query.outputs.missing_count > 0
        run: |
          MISSING_COUNT="${{ steps.query.outputs.missing_count }}"
          MISSING_LIST="${{ steps.query.outputs.missing_list }}"
          YESTERDAY="${{ steps.dates.outputs.yesterday }}"

          curl -s -X POST "$GOOGLE_CHAT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"cards\": [
                {
                  \"header\": {
                    \"title\": \"🌅 Báo cáo AI - Nhắc nhở buổi sáng\",
                    \"subtitle\": \"Ngày ${YESTERDAY}\",
                    \"imageUrl\": \"https://www.gstatic.com/images/icons/material/system/2x/warning_amber_48dp.png\"
                  },
                  \"sections\": [
                    {
                      \"widgets\": [
                        {
                          \"textParagraph\": {
                            \"text\": \"<b>${MISSING_COUNT} thành viên</b> chưa báo cáo (số trong ngoặc = số ngày liên tiếp quên):\\n\\n${MISSING_LIST}\\n\\n📌 Vui lòng nhắc nhở các bạn ghi nhận AI usage nhé!\"
                          }
                        },
                        {
                          \"buttons\": [
                            {
                              \"textButton\": {
                                \"text\": \"📊 Xem Dashboard\",
                                \"onClick\": {
                                  \"openLink\": {
                                    \"url\": \"${APP_URL}\"
                                  }
                                }
                              }
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }"

          echo "✅ Notification sent for $MISSING_COUNT missing reporters"

      - name: Skip notification (all reported)
        if: steps.query.outputs.missing_count == 0
        run: |
          echo "🎉 All team members reported yesterday! No notification needed."
